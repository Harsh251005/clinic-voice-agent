<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Call $name</title>
<link rel="stylesheet" href="/static/call.css">
</head>
<body>
<main class="card" data-slug="$slug">
  <p class="eyebrow">Receptionist</p>
  <h1>$name</h1>
  <p class="address">$address</p>

  <div class="dial">
    <span class="ring" aria-hidden="true"></span>
    <button id="call" class="call" type="button" aria-label="Start the call">
      <svg class="icon-call" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      <svg class="icon-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.3 11.3 0 0 0-2.66 1.85 1 1 0 0 1-1.41-.02L.29 13.1a1 1 0 0 1 0-1.42C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.68a1 1 0 0 1 0 1.42l-2.48 2.45a1 1 0 0 1-1.41.02 11.3 11.3 0 0 0-2.66-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></svg>
    </button>
  </div>

  <p id="status" class="status" aria-live="polite">Tap to talk to the receptionist</p>
  <p id="timer" class="timer" hidden>00:00</p>

  <p class="note">
    You'll speak with the clinic's automated assistant. It can answer questions
    and book, change or cancel appointments.
    <span lang="hi">आप हिंदी या अंग्रेज़ी में बात कर सकते हैं।</span>
  </p>
  $phone
</main>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"
        integrity="sha384-MveBYLjjZe2VXnKzvBbPfyh5MEbiqNDeta9nzIGbtqnXmC+CwX/mLE5+M9PDIcPy"
        crossorigin="anonymous"></script>
<script src="/static/call.js"></script>
</body>
</html>
