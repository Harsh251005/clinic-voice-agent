# Only for writing new revisions after changing models.py:
#   uv run alembic revision --autogenerate --rev-id 0002 -m "what changed"
# Applying them is `uv run python -m clinic_agent.store.migrations`.
[alembic]
script_location = %(here)s/clinic_agent/store/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
