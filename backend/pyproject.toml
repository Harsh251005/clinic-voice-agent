[project]
name = "clinic-voice-agent"
version = "0.1.0"
description = "Hindi/Hinglish voice receptionist for Indian clinics"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "livekit-agents[sarvam,openai]>=1.8.11",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Live tests call OpenAI (as text, never Sarvam) with the real keys and spend credits:
# run them deliberately with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls the real OpenAI API using the key in .env"]
