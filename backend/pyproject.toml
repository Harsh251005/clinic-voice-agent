[project]
name = "clinic-voice-agent"
version = "0.1.0"
description = "Hindi/Hinglish voice receptionist for Indian clinics"
requires-python = ">=3.13"
dependencies = [
    "livekit-agents[sarvam,openai,elevenlabs]>=1.8.2",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Live tests call Sarvam with the real key and spend credits: run them
# deliberately with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls real Sarvam APIs using SARVAM_API_KEY from .env"]
