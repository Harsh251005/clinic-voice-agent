# Pinned so the OS dark mode can't turn our light palette into white-on-white.
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F6F7F9"
# Streamlit fills fields with this colour; it must differ from the white cards.
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "medium"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
